name: Refresh East Africa open tenders

on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/refresh-tender-hub.yml
      - tender-research/refresh_open_tenders.py
      - tender-research/unabsec-notices.json

permissions:
  contents: write

concurrency:
  group: serene-tender-hub-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install the HTML parser
        run: python -m pip install beautifulsoup4==4.13.4
      - name: Refresh the public tender sources
        run: python tender-research/refresh_open_tenders.py
      - name: Publish the feed snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tender-research/live/open-tenders.json
          git diff --cached --quiet && exit 0
          git commit -m 'Refresh open East Africa tender notices'
          git push origin HEAD:main
